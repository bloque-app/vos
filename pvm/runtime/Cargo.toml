[package]
name = "vos-pvm"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
authors.workspace = true
description = "Capability-based PVM runtime used by VOS."

[features]
default = ["std"]
std = ["dep:libc", "dep:memoffset", "dep:blake2", "dep:curve25519-dalek"]

[dependencies]
blake2 = { version = "0.10", default-features = false, optional = true }
# The constrained curve precompiles 110-114, served natively to an outer program (std hosts).
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "precomputed-tables"], optional = true }
libc = { version = "0.2", optional = true }
memoffset = { version = "0.9", optional = true }
scale = { package = "vos-pvm-codec", path = "../codec", default-features = false }
vos-pvm-program = { path = "../program" }
# Non-workspace dep lines: the workspace pins enable default features (std),
# and workspace-inherited features are additive. vos_pvm's always-compiled
# modules must stay no_std-clean (thiserror 2 derives core::error::Error
# without its std feature).
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
proptest = "1"
serde_json = "1"
