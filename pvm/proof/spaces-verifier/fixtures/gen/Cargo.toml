# Proves the real-proof test fixture of `vos-spaces-verifier` with VOS's own prover.
#
# Native only, with `vos-pvm-proof`'s `prover` feature on: its own workspace, so that feature never
# unifies into the verifier's no_std graph. See `../README.md`.
[package]
name = "vos-spaces-fixture-gen"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
vos-pvm-proof = { path = "../../.." }
vos-pvm-proof-verifier = { path = "../../../verifier" }
vos-pvm = { path = "../../../../runtime" }
postcard = { version = "1", features = ["alloc"] }
blake2b_simd = "1"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
