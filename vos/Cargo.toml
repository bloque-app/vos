[package]
name = "vos"
description = "VOS runtime: a deterministic actor host with CRDT or Raft replication, libp2p transport, and content-addressed storage."
keywords = ["vos", "p2p", "actor", "pvm", "crdt"]
categories = ["network-programming", "embedded", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[features]
default = ["std", "http-client", "storage", "network"]
std = ["dep:vos-pvm", "dep:vos-pvm-compiler", "dep:toml", "dep:serde", "dep:pollster", "dep:tracing", "dep:tracing-subscriber", "dep:clap", "dep:libloading", "dep:object", "dep:async-io", "dep:async-executor", "dep:futures-lite", "dep:futures-channel", "dep:futures-rustls", "dep:getrandom", "dep:vos-pvm-precompiles", "dep:cipher-clerk", "dep:rand_chacha", "dep:zeroize", "dep:libc", "dep:fs2", "dep:ed25519-dalek"]
macros = ["dep:vos-macros"]
pvm = []
service = ["pvm"]
service-runtime = ["service"]
# Typed service-actor client for node-local native extensions. Opt-in keeps
# actors that do not use native I/O byte-identical to their existing PVMs.
native-extension-client = ["pvm"]
# The bundled agent runtime is an infrastructure guest like the former
# service runtime, but it uses only the standard PVM inner-machine surface.
# Keep its larger transient arena out of ordinary application actors.
agent-runtime = ["pvm", "dep:ed25519-dalek", "dep:curve25519-dalek"]
experimental-state-blocks = ["vos-agent-sdk/experimental-state-blocks"]
# Host-side same-run Standard Refine execution, proving, bounded proof
# material, and deterministic replay verification. Kept opt-in so ordinary
# hosts and every no_std guest avoid the prover dependency graph.
agent-transition-proof = ["std", "pvm", "dep:vos-pvm-proof"]
# Host-only cryptography and strict control-chain verification for Private
# agents. Keeping this separate from `std` avoids linking key material and
# cipher implementations into hosts which do not serve Private agents.
private-agent-crypto = [
    "std",
    "dep:chacha20poly1305",
    "dep:ed25519-dalek",
    "dep:hkdf",
    "dep:rand_core",
    "dep:sha2",
    "dep:subtle",
    "dep:x25519-dalek",
    "dep:zeroize",
]
# Durable ciphertext-only storage and bounded authenticated anti-entropy for
# Private agents. This is host infrastructure and never enters actor guests.
private-agent-store = ["private-agent-crypto"]
# NOTE: the ZK actor-IO binding is tagless (`vos::zk`) — the io-hash
# primitive `compute_io_hash` is pure and always available (guest +
# host).  Proof *verification* (STARK validity ∧ io-binding) lives in
# the `prover` host extension, which depends on `vos-pvm-proof-verifier`
# directly; vos itself does not pull a verifier, so there is no
# `zk-verify` feature.
extension = ["macros"]
wasm = ["macros"]
# WASM bootstrap: provides global allocator (dlmalloc) and panic
# handler so the actor crate just needs `#![no_std]` and `use vos::*`.
wasm-bootstrap = ["wasm", "dep:dlmalloc"]
# Enables actor-initiated outbound HTTP fulfillment (EFFECT_FETCH).
http-client = ["dep:ureq"]
# Built-in authenticated HTTP ingress. This is host-local infrastructure,
# independent of the actor extension ABI and optional for embedders.
http-ingress = [
    "std",
    "dep:bytes",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:serde_json",
    "dep:serde_urlencoded",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:rustls-pemfile",
]
# Built-in authenticated SSH ingress and semantic space shell. The SSH
# transport is node-owned infrastructure; actor packages never link it.
ssh-ingress = ["std", "dep:s4-server", "dep:ssh-key", "dep:tokio"]
# Enables redb-backed extension state persistence in the extension host.
storage = ["dep:redb", "dep:merkle-crdt", "dep:futures-executor", "dep:futures-channel", "dep:vos-raft"]
# Enables the libp2p-backed networking layer (peer transport, identity,
# discovery). Pulls a substantial dep tree (libp2p + tokio runtime),
# so it's opt-in. Hosts that want cross-node spaces enable it; bare
# single-node runs (extensions, no_std actors) don't need it.
network = ["std", "dep:libp2p", "dep:tokio", "dep:async-trait"]

[dependencies]
vos-agent-sdk.workspace = true
vos-protocol.workspace = true
vos-macros = { path = "vos-macros", version = "0.1.0", optional = true }
vos-raft = { path = "../support/vos-raft", version = "0.1.0", default-features = false, features = ["std"], optional = true }
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"] }
# Logging facade — re-exported as `vos::log` and pulled into
# `vos::prelude::*`. `default-features = false` keeps it usable
# in no_std actor / wasm guests; the std-side host code can use
# the same facade and bridge to tracing if it wants.
log = { version = "0.4", default-features = false }
vos-pvm-program = { workspace = true }

# std-only: workspace-owned PVM runtime and compiler dependencies.
vos-pvm = { workspace = true, optional = true }
vos-pvm-compiler = { workspace = true, optional = true }
vos-pvm-proof = { workspace = true, optional = true }
# Host-side execution of the vos-pvm-proof Ristretto/scalar precompile ECALLs, so
# a pvm-precompile actor (cipher-clerk crypto) runs LIVE in the runtime
# bit-identically to the prover's tracer — the `ristretto` feature's
# host functions fall through to curve25519-dalek off-target. Host-only
# (behind `std`); the guest emits the ECALLs, it doesn't link this.
vos-pvm-precompiles = { workspace = true, features = ["ristretto"], optional = true }
toml = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
libloading = { version = "0.8", optional = true }
# Host-side ELF symbol reader — locates a provable actor's `__VOS_WITNESS`
# buffer address (`vos::zk::witness_addr`) so a caller can hand the host
# prover the witness-injection offset. std-only.
object = { version = "0.36", default-features = false, features = ["std", "read_core", "elf"], optional = true }
# Host-side OS entropy for the BOOT_CONTEXT seam: mints a fresh per-boot
# `boot_token` + the host-local `device_id`. `std`-gated — the no_std riscv
# guest reaches the host via the BOOT_CONTEXT ecall and never links this.
getrandom = { version = "0.2", optional = true }
# Host-only device signer used by service Refine. Application VMs receive only the
# public key and Schnorr signature; the seed never enters guest memory. The
# no_std actor/service builds do not enable `std`, so this dependency cannot
# leak into a canonical guest artifact.
cipher-clerk = { git = "https://codeberg.org/Virto/CipherClerk.git", rev = "e9a7b0851f183c14dbd1635dbf0437c86682ad6f", default-features = false, features = ["signing"], optional = true }
rand_chacha = { version = "0.3", default-features = false, optional = true }
zeroize = { version = "1", default-features = false, optional = true }
libc = { version = "0.2", optional = true }
fs2 = { version = "0.4", optional = true }
blake2b_simd = { version = "1", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"], optional = true }
# Guest-side execution of the constrained Ristretto/scalar precompile ECALLs
# (110-114) for Agent actors. The standard AgentRuntime keeps no private
# outer-host ABI, so it computes them as deterministic guest code, as it does
# BLAKE2b. The same crate and major version the precompile shims fall back to.
curve25519-dalek = { version = "4.1", default-features = false, optional = true }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"], optional = true }
hkdf = { version = "0.12", default-features = false, optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
subtle = { workspace = true, optional = true }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"], optional = true }
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }
dlmalloc = { version = "0.2", optional = true, features = ["global"] }
redb = { version = "2", optional = true }
merkle-crdt = { path = "../support/merkle-crdt", version = "0.1.0", features = ["redb"], optional = true }
libp2p = { version = "0.56", default-features = false, features = ["tcp", "yamux", "noise", "tokio", "mdns", "macros", "ping", "identify", "request-response", "gossipsub"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "fs", "net", "io-util"], optional = true }
async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", default-features = false, features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
serde_json = { version = "1", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
# Host-side extension executor: the cooperative scheduler runs host-side,
# driven by `async-io::block_on(LocalExecutor::run(..))`. `LocalExecutor`
# keeps the extension's `!Send` per-task futures on the one thread that owns
# the instance. These sit in the `std` feature tier (not `network`) because
# every extension host needs the executor, including single-node
# `std,http-client,storage` builds with no libp2p. Versions are
# pinned to what libp2p already resolved (async-io 2.6) so the network
# build doesn't fork the dep tree. The no_std extension/wasm builds
# (default-features = false) never enable `std`, so the .so itself stays
# free of these deps.
async-io = { version = "2.6", optional = true }
async-executor = { version = "1.14", optional = true }
# Async waits and timers for request-driven extension effects.
futures-lite = { version = "2.6", optional = true }
# Rustls types and the ring provider used by production signature verification.
futures-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring"] }
# PEM parsing for the optional built-in HTTP ingress TLS listener.
rustls-pemfile = { version = "2", optional = true }
# Exact companion revision carrying stable principal/credential separation
# and strict host-key persistence for the built-in space shell.
s4-server = { git = "https://codeberg.org/Virto/s4.git", rev = "70f90315ae59031023aedc9459bac72cb79725d8", optional = true }
ssh-key = { version = "=0.7.0-rc.10", optional = true }
# Drives vos-raft's async Storage / Transport futures from inside
# the existing sync Network::set_raft_handler / RaftCommit code
# paths. Std-only — gated behind the `storage` feature so no_std
# actor builds (default-features = false) don't drag std into the
# riscv guest.
futures-executor = { version = "0.3", default-features = false, features = ["std"], optional = true }
futures-channel = { version = "0.3", default-features = false, features = ["alloc", "std"], optional = true }

# `blake2b_simd` is no_std. Ordinary PVM actors use the accelerated ECALL,
# while the infrastructure agent runtime links this software backend so it
# needs no private outer-host crypto operation.

[dev-dependencies]
# Built-in PVM actor — host tests need the typed `SpaceRegistryRef`
# to drive the registry over the network. `default-features = false`
# keeps the `bin` (PVM entry-point) glue out of the host link;
# tests load the pre-built actor ELF separately and only need the
# Ref surface from the rlib.
space-registry = { path = "../actors/space-registry", default-features = false }
# Exact configuration codec for the bundled Authority PVM integration test.
system-authority = { path = "../actors/system-authority", default-features = false }
system-catalog = { path = "../actors/system-catalog", default-features = false }
# Per-bank stateful clerk agent — host tests use ClerkLedgerRef to
# drive bootstrap / create_account / account against the wire ABI.
clerk-ledger = { path = "../actors/clerk-ledger", default-features = false }
# Cross-clerk voucher ingress actor. Host tests use ClerkBridgeRef
# to drive the verify-and-dedup flow. default-features = false
# keeps the PVM bin glue out of the host link; tests load the
# pre-built ELF separately and only need the Ref surface from
# the rlib.
clerk-bridge = { path = "../actors/clerk-bridge", default-features = false }
# Settlement venue actor — host tests use ClerkSettleRef to drive
# register_bank / submit_claim / settle_window against the wire ABI.
# default-features = false keeps the PVM bin glue out; tests load the
# pre-built ELF separately and only need the Ref surface from the rlib.
clerk-settle = { path = "../actors/clerk-settle", default-features = false }
# General-purpose host-side prover extension. Tests drive the federation
# flow (producer transpiles voucher-check.elf + calls prove_chain_segments
# → puts each segment + a manifest in CAS → ships the manifest hash via
# voucher.proof.bytes; verifier bridge dispatches verify_chain against the
# caller-supplied allowlist) and use it as a blob_get probe in
# proof_blob_cross_node.
prover-extension = { path = "../extensions/prover" }
# vos-pvm-proof canonical prover + segmentation — the `voucher_check_commitment_
# drift_guard` re-derives the pinned VOUCHER_CHECK_COMMITMENTS by proving
# two canonical segments. The optional normal dependency above is used only
# by production physical transition hosts; retaining this dev dependency
# keeps the pre-existing default test gate intact.
vos-pvm-proof = { workspace = true }
# Host-side cipher-clerk with `signing` so tests can build
# signed CreateAccount events to push through the ledger. Pulls in
# OsRng-backed signing — fine on host; the actor itself never
# links it (the clerk-ledger crate keeps cipher-clerk on
# default-features = []).
cipher-clerk = { git = "https://codeberg.org/Virto/CipherClerk.git", rev = "e9a7b0851f183c14dbd1635dbf0437c86682ad6f", default-features = false, features = ["signing", "viewing-keys", "voucher", "notes", "helpers", "settlement"] }
# The cipher-clerk ↔ vos witness bridge — the W4 clerk-apply gate builds
# a ClerkTransitionWitness through it and asserts the Task's attested
# roots match a live apply.
clerk-witness = { path = "../clerk-witness", default-features = false }
# Used by a single robustness test that hand-corrupts the
# actor's persisted state to simulate schema drift.
redb = "2"
# Reference blake2b implementation for cross-checking the
# vos::crypto software fallback. Dev-only; the in-tree fallback
# is self-contained.
blake2 = "0.10"
# Ciphersuite-1 reference impls for the in-PVM crypto execution gate
# (`vos/tests/crypto_spike_pvm.rs`): the test drives the `crypto_spike` actor's
# `tv_*` handlers and asserts the PVM-computed bytes are bit-exact against these
# host RustCrypto crates. Versions track `actors/_crypto_spike/Cargo.toml`.
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = { version = "0.10", features = ["aes", "alloc"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
trybuild = "1"
