[workspace]

[package]
name = "agent-runtime"
description = "Bundled standard agent runtime for VOS"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/virto-network/vos"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
experimental-state-blocks = ["vos/experimental-state-blocks"]
# The VOS-native profile: actor programs by ProgramId through historical_lookup.
vos-native = ["vos/runtime-program-lookup"]
# Hash through the outer host's BLAKE2b precompile (ecalli 100).
blake2b-precompile = ["vos/runtime-blake2b-precompile"]
# Actors' curve precompiles served natively by the outer host.
native-curve = ["vos/runtime-native-curve"]
# Composite invocations: steps over the Agent's own actors in one Linear transition.
# Not the standard runtime: a separate program, for Agents that pin it.
composite = ["vos/runtime-composite"]

[target.'cfg(target_arch = "riscv64")'.dependencies]
vos = { path = "../../vos", version = "0.1.0", default-features = false, features = ["agent-runtime"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
